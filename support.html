<head>
  <meta charset="UTF-8" />

  <title>Support — Style Mirror</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 16px; line-height: 1.75; color: #1c1c1e; background: #f2f2f7;
    }
    .langbar {
      max-width: 760px; margin: 32px auto 0; display: flex; gap: 8px; padding: 0 8px;
    }
    .langbar button {
      font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #d1d1d6;
      background: #fff; color: #3a3a3c; padding: 7px 16px; border-radius: 999px; transition: all .15s;
    }
    .langbar button.active { background: #0071e3; color: #fff; border-color: #0071e3; }
    .container {
      max-width: 760px; margin: 16px auto 48px; background: #fff; border-radius: 16px;
      padding: 48px 56px; box-shadow: 0 2px 16px rgba(0,0,0,.08);
    }
    .container h1 { font-size: 26px; font-weight: 700; letter-spacing: -.4px; margin-bottom: 8px; }
    .container h2 { font-size: 18px; font-weight: 600; margin: 36px 0 12px; color: #1c1c1e; }
    .container h3 { font-size: 15.5px; font-weight: 600; margin: 22px 0 8px; color: #1c1c1e; }
    .container p, .container li { color: #3a3a3c; }
    .container p { margin: 10px 0; }
    .container ul, .container ol { padding-left: 20px; margin: 8px 0; }
    .container li { margin-bottom: 6px; }
    .container hr { border: none; border-top: 1px solid #e5e5ea; margin: 28px 0; }
    .container a { color: #0071e3; text-decoration: none; }
    .container a:hover { text-decoration: underline; }
    .container blockquote {
      background: #f0f4ff; border-left: 4px solid #0071e3; border-radius: 6px;
      padding: 12px 18px; margin: 14px 0; font-size: 14.5px; color: #0051a8;
    }
    .container blockquote p { margin: 4px 0; color: #0051a8; }
    .container pre { white-space: pre-wrap; font: inherit; }
    @media (max-width: 600px) { .container { padding: 32px 22px; margin: 12px auto 32px; border-radius: 0; } }
  </style>
</head>
<body>
  <div class="langbar">
    <button data-l="en" class="active">English</button>
    <button data-l="ko">한국어</button>
    <button data-l="ja">日本語</button>
  </div>
  <div class="container" id="content"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    var TITLES = { en: 'Support — Style Mirror', ko: '고객 지원 — Style Mirror', ja: 'サポート — Style Mirror' };
    function render(l) {
      var md = document.getElementById('md-' + l).textContent;
      var el = document.getElementById('content');
      if (window.marked) { el.innerHTML = marked.parse(md); }
      else { var pre = document.createElement('pre'); pre.textContent = md; el.innerHTML = ''; el.appendChild(pre); }
      document.documentElement.lang = l;
      document.title = TITLES[l];
      var btns = document.querySelectorAll('.langbar button');
      for (var i = 0; i < btns.length; i++) { btns[i].classList.toggle('active', btns[i].getAttribute('data-l') === l); }
    }
    (function () {
      var btns = document.querySelectorAll('.langbar button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () { render(this.getAttribute('data-l')); });
      }
      render('en');
    })();
  </script>
