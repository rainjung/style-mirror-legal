# Style Mirror — Support

> Questions, bug reports or feedback? Email us.

## Contact

**Email:** [innocode.core@gmail.com](mailto:innocode.core@gmail.com)

For problems, please include your device model, iOS/Android version and what happened (a screenshot helps).

---

## Subscriptions

- **Manage or cancel:** subscriptions are billed by the App Store or Google Play and renew automatically until you cancel.
  - iPhone: Settings → your name → Subscriptions, or [apps.apple.com/account/subscriptions](https://apps.apple.com/account/subscriptions)
  - Android: [Google Play subscriptions](https://play.google.com/store/account/subscriptions)
- **Restore purchases:** on the purchase screen in the app, tap **Restore Purchases**.

## Refunds

Refunds for store purchases are decided by Apple or Google, not by us.

- App Store: request at [reportaproblem.apple.com](https://reportaproblem.apple.com)
- Google Play: request through Google Play

Credits you have already used are not eligible for a refund — see the refund section of the [Terms of Service](terms.html).

<h2 id="delete">Delete your Style Mirror account</h2>

This applies to the **Style Mirror** app (StyleMirror: Outfit Try-On) by **InnoCode**.

**Option 1 — in the app (immediate)**

1. Open Style Mirror and go to **Profile**.
2. Tap **Account → Delete account**.
3. Confirm. Your account is deleted right away.

**Option 2 — by email (no app needed)**

1. Email [innocode.core@gmail.com](mailto:innocode.core@gmail.com?subject=Account%20deletion%20request) with the subject **Account deletion request**.
2. Send it from the email address you use to sign in, or include that address in the message.
3. We may ask you to confirm the request, then delete your account **within 30 days** and reply when it is done.

**What is deleted**

- Your sign-in account (email address and sign-in identity)
- Your fitting job records
- Temporary uploaded files in your user folder

**What is kept, and for how long**

- Credit ledger, payment and generation job records, and moderation/abuse-prevention events are kept **for 5 years** in de-identified form — no longer linked to your identity — for fraud prevention, accounting and legal compliance, then deleted.
- Billing records held by Apple, Google or RevenueCat follow their own policies.
- Deleting your account does **not** cancel a store subscription — cancel it in the App Store or Google Play (see *Subscriptions* above).

Details are in the [Privacy Policy](privacy.html).

---

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    var TITLES = { en: 'Support — Style Mirror', ko: '고객 지원 — Style Mirror', ja: 'サポート — Style Mirror' };
    function render(l) {
      var md = document.getElementById('md-' + l).textContent;
      var el = document.getElementById('content');
      if (window.marked) { el.innerHTML = marked.parse(md); }
      else { var pre = document.createElement('pre'); pre.textContent = md; el.innerHTML = ''; el.appendChild(pre); }
      document.documentElement.lang = l;
      document.title = TITLES[l];
      var btns = document.querySelectorAll('.langbar button');
      for (var i = 0; i < btns.length; i++) { btns[i].classList.toggle('active', btns[i].getAttribute('data-l') === l); }
    }
    (function () {
      var btns = document.querySelectorAll('.langbar button');
      for (var i = 0; i < btns.length; i++) {
        btns[i].addEventListener('click', function () { render(this.getAttribute('data-l')); });
      }
      render('en');
      // 본문을 JS 로 그리므로 #delete 같은 앵커는 렌더 후 직접 스크롤한다.
      if (location.hash) {
        var t = document.getElementById(location.hash.slice(1));
        if (t) t.scrollIntoView();
      }
    })();
  </script>
